[package]
name = "consumers"
version = "0.1.0"
edition.workspace = true
description = "RFP-021 example consumers (erc20_receiver, eth_receiver): chained Attest + nullifier"

[features]
default = []
guest = ["dep:risc0-zkvm", "attest-program/entry"]

[dependencies]
borsh = { version = "1", default-features = false, features = ["derive", "std"] }
sha2 = { version = "0.10", default-features = false }
inclusion = { path = "../inclusion" }
attest-program = { path = "../attest-program" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "6aaabe526b5cd4558d8f0506a97dd1b9f456933c" }
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std"], optional = true }
