[package]
name = "relayer"
version = "0.0.0"
edition.workspace = true

[[bin]]
name = "rfp021"
path = "src/main.rs"

[features]
default = []
# Real LEZ submitter for `run-relayer` (LEZ v0.4.0-rc1 crates; build with `cargo +1.98.1`).
lez = ["dep:lez-client"]

[dependencies]
lc-core = { path = "../lc-core" }
# EL routing table (el_route), shared with the Logos module.
inclusion = { path = "../inclusion", features = ["host"] }
lez-client = { path = "../lez-client", optional = true }
# RFP requires the Logos Ethereum core module for LC material; pinned, default-features=false skips the nix-only logos_module.
beacon_api_module = { git = "https://github.com/logos-co/logos-evm-beacon-api-module", rev = "f19ec8207d36d7cefba1ede5129ec11b74ca2140", default-features = false }
# ...and for all execution-layer reads (headers, eth_getProof, receipts): eth_rpc_module's EthRpc, fail-closed, SOCKS-capable.
eth_rpc_module = { git = "https://github.com/logos-co/logos-evm-eth-rpc-module", rev = "b39bebf3a2e0801d8272aeb0da04ed172719955f", default-features = false }
alloy-primitives = { version = "1", features = ["serde"] }
alloy-rlp = { version = "0.3", features = ["derive"] }
alloy-trie = "0.9"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

[dev-dependencies]
tempfile = "3"
