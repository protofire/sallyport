[package]
name = "bridge-prover"
version = "0.1.0"
edition.workspace = true
description = "RFP-022 burn_member release proof: succinct proof, Groth16 wrap (risc0 Docker prover), seal + journal"

[dependencies]
bridge-core = { path = "../bridge-core" }
program-methods = { path = "../program-methods" }
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std", "prove", "client"] }
borsh = "1"
anyhow = "1"
hex = "0.4"
serde_json = "1"
