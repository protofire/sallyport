[package]
name = "program-tests"
version = "0.1.0"
edition.workspace = true
description = "Executor-level tests (LEZ V03State) and e2e client for the RFP-021 programs"

[dependencies]
attest-program = { path = "../attest-program", features = ["witness"] }
consumers = { path = "../consumers" }
bridge = { path = "../bridge", features = ["host"] }
bridge-core = { path = "../bridge-core" }
program-methods = { path = "../program-methods" }
lc-core = { path = "../lc-core" }
inclusion = { path = "../inclusion", features = ["host"] }
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "6aaabe526b5cd4558d8f0506a97dd1b9f456933c" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "6aaabe526b5cd4558d8f0506a97dd1b9f456933c" }
borsh = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
alloy-primitives = { version = "1", default-features = false } # keccak for synthetic headers

[dev-dependencies]
lez-client = { path = "../lez-client", default-features = false } # ONE_TX_MAX_NON_SIGNERS routing limit
blst = "0.3.16"
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std", "client"] } # sha_syscall test executor
sha2 = "0.10"
