[package]
name = "bridge-cli"
version = "0.1.0"
edition.workspace = true
description = "RFP-022 client, root signer and e2e driver (binary `b22`)"

[[bin]]
name = "b22"
path = "src/main.rs"

[dependencies]
bridge-core = { path = "../bridge-core" }
bridge = { path = "../bridge", features = ["host"] }
attest-program = { path = "../attest-program", features = ["witness"] }
consumers = { path = "../consumers" }
lc-core = { path = "../lc-core", features = ["host-bls"] }
inclusion = { path = "../inclusion", features = ["host"] }
program-methods = { path = "../program-methods" }
program-tests = { path = "../program-tests" }
relayer = { path = "../relayer" }
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "1806e873ea2ac0e1b608aa7cf2f9b6e1fb12db21" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "1806e873ea2ac0e1b608aa7cf2f9b6e1fb12db21" }
common = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "1806e873ea2ac0e1b608aa7cf2f9b6e1fb12db21" }
# mnemonic parsing for wallet recovery (same 2.2 line the wallet uses)
bip39 = "2.2"
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "1806e873ea2ac0e1b608aa7cf2f9b6e1fb12db21" }
program_loader_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "1806e873ea2ac0e1b608aa7cf2f9b6e1fb12db21" }
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "1806e873ea2ac0e1b608aa7cf2f9b6e1fb12db21", features = ["client"] }
risc0-binfmt = "3.0.2"
# ReceiptClaim digest for the RISC0_DEV_MODE mock seal (no proving here)
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
alloy-primitives = { version = "1", features = ["rlp"] }
alloy-rlp = "0.3"
k256 = { version = "0.13", features = ["ecdsa"] }
blst = "0.3.16"
borsh = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "time"] }
