[package]
name = "release-guest"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
bridge-core = { path = "../../bridge-core", default-features = false }
borsh = { version = "1", default-features = false, features = ["std"] }
inclusion = { path = "../../inclusion", features = ["risc0-keccak"] } # routes alloy keccak to the risc0 coprocessor, as in the other guests
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std"] }

[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.9-risczero.0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
