[package]
name = "attest"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "attest"
path = "src/main.rs"

[[bin]]
name = "spec_selftest" # test-only (crates/spec-tests)
path = "src/spec_selftest.rs"

[dependencies]
attest-program = { path = "../../attest-program", features = ["guest"] }
blst = "0.3.16" # spec_selftest bin only (patched below, as attest-program's)
borsh = { version = "1", default-features = false, features = ["derive", "std"] } # spec_selftest bin only
lc-core = { path = "../../lc-core", default-features = false } # spec_selftest bin only
inclusion = { path = "../../inclusion", features = ["risc0-keccak"] }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "6aaabe526b5cd4558d8f0506a97dd1b9f456933c" }
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std"] }

[patch.crates-io]
blst = { git = "https://github.com/risc0/blst", tag = "v0.3.16-risczero.0" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.9-risczero.0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
