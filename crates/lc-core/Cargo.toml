[package]
name = "lc-core"
version = "0.1.0"
edition.workspace = true
description = "Ethereum light-client (Altair sync protocol, Electra/Fulu/Gloas headers) verification core for RFP-021"

[features]
default = ["json"]
# Beacon-API JSON -> types (host/relayer side; pulls serde_json). Guest: default-features = false.
json = ["dep:serde_json", "dep:hex"]
# Host BLS verifier on crates.io blst (tests / relayer pre-checks). Guest verifier lands separately.
host-bls = ["dep:blst"]

[dependencies]
borsh = { version = "1", default-features = false, features = ["derive", "std"] }
sha2 = { version = "0.10", default-features = false }
serde_json = { version = "1", optional = true }
hex = { version = "0.4", optional = true }
blst = { version = "0.3.16", optional = true }

[dev-dependencies]
hex = "0.4"
serde_json = "1"
