[package]
name = "bridge-core"
version = "0.1.0"
edition.workspace = true
description = "RFP-022 bridge formats: derivations, PDA seeds, LEZ state/messages, Ethereum digests (host + guest)"

[features]
default = ["host"]
# Host-only: secp256k1 key -> Ethereum address for `recipient_j`. Guests use default-features = false.
host = ["dep:k256"]

[dependencies]
borsh = { version = "1", default-features = false, features = ["derive", "std"] }
sha2 = { version = "0.10", default-features = false }
alloy-primitives = { version = "1", default-features = false }
attest-program = { path = "../attest-program" }
consumers = { path = "../consumers" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "6aaabe526b5cd4558d8f0506a97dd1b9f456933c" }
k256 = { version = "0.13", optional = true }

[dev-dependencies]
serde_json = "1"
