[package]
name = "inclusion"
version = "0.1.0"
edition.workspace = true

[features]
default = []
# host-only helpers: build header RLP / receipt-trie proofs from JSON-RPC responses.
host = ["dep:serde_json", "std"]
std = ["alloy-trie/std", "alloy-rlp/std", "alloy-primitives/std"]
# Guest-only: route alloy keccak256 to the risc0 keccak coprocessor (src/zkvm_keccak.rs).
# Never enable on host builds: `native-keccak` leaves `native_keccak256` to be linked.
risc0-keccak = ["dep:risc0-zkvm", "alloy-primitives/native-keccak"]

[dependencies]
alloy-primitives = { version = "1", default-features = false }
alloy-rlp = { version = "0.3", default-features = false }
alloy-trie = { version = "0.9", default-features = false }
sha2 = { version = "0.10", default-features = false }
borsh = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", optional = true }
risc0-zkvm = { version = "=3.0.5", default-features = false, optional = true }
