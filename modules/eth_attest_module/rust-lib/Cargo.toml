[package]
name = "eth_attest_module"
version = "0.1.0"
edition = "2021"
description = "Logos module for RFP-021: produce / dry-run-verify Ethereum light-client attestations."
# lee_core (via lez-client) needs rustc >= 1.98; metadata.json nix.rust.toolchain pins 1.98.1.
rust-version = "1.98"

# Own workspace: the builder compiles this directory alone. crates/* are symlinks to the repo's
# crates/ (replaced by real copies when flake.nix stages the source); they inherit edition here.
[workspace]
resolver = "3"

[workspace.package]
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
lc-core = { path = "crates/lc-core", features = ["json", "host-bls"] }
inclusion = { path = "crates/inclusion", features = ["host"] }
serde_json = "1"
hex = "0.4"
logos-rust-sdk = { path = "../logos-rust-sdk-src", optional = true }
# read_instance / submit_update: the relayer's LEZ client (crates/lez-client, shared). `submit` signs on
# lee_core alone; its `wallet` feature (LEZ wallet: rocksdb/rapidsnark/circuit natives) stays off.
lez-client = { path = "crates/lez-client", default-features = false, features = ["submit"], optional = true }

[dev-dependencies]
alloy-primitives = { version = "1", default-features = false } # keccak for hand-built trie nodes in tests

[features]
default = ["logos_module"]
logos_module = ["dep:logos-rust-sdk", "dep:lez-client"]
