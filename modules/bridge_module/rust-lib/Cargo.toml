[package]
name = "bridge_module"
version = "0.1.0"
edition = "2021"
description = "Logos module for the RFP-022 prototype: deposit derivation and registry decoding over bridge-core."
# lee_core needs rustc >= 1.98; metadata.json nix.rust.toolchain pins 1.98.1.
rust-version = "1.98"

# Own workspace: the builder compiles this directory alone. crates/* are symlinks to the repo's crates/
# (replaced by real copies when flake.nix stages the source); they inherit edition here.
[workspace]
resolver = "3"

[workspace.package]
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
bridge-core = { path = "crates/bridge-core" }
serde_json = "1"
hex = "0.4"
borsh = "1"
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "6aaabe526b5cd4558d8f0506a97dd1b9f456933c" }
logos-rust-sdk = { path = "../logos-rust-sdk-src", optional = true }

[features]
default = ["logos_module"]
logos_module = ["dep:logos-rust-sdk"]
