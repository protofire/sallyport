[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./out" }, { access = "read", path = "../../fixtures/b22" }, { access = "read", path = "./test/fixtures" }]

[profile.default.fuzz]
runs = 256

# The USDT mock is the verified mainnet source; compile it with its mainnet compiler.
[[profile.default.compilation_restrictions]]
paths = "test/mocks/TetherToken.sol"
version = "=0.4.18"

[fmt]
ignore = ["test/mocks/TetherToken.sol"]
